[project]
name = "darkwatch"
version = "0.5.1"
description = "Darkwatch: watchlist-driven dark web exposure monitor. Finds a person's or company's identifiers on ransomware leak sites, onion pages (over a managed Tor), breach and paste data; scores, dedupes, reports with next actions and alerts."
readme = "README.md"
authors = [
    { name = "Rithik Krishna", email = "317035893+Daemon-VI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests[socks]>=2.32",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "aiosmtpd>=1.4", "httpx>=0.27"]  # httpx: fastapi.testclient

[project.scripts]
darkwatch = "darkwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/darkwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# a malformed watchlist is a ValueError by contract: the CLI turns it into exit code 2
"src/darkwatch/config.py" = ["TRY004"]
